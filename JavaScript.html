// GAS Promise Wrapper
function runGAS(funcName, ...args) {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.warn(`[Mock GAS] Calling ${funcName}`, args);
      setTimeout(() => resolve({ success: true }), 400);
      return;
    }
    // Safety net: ต่อให้ google.script.run ไม่คืน callback (เช่น กรณี auth/scopes)
    // ก็จะไม่ค้างที่ overlay โหลดตลอดไป และแสดงข้อความให้ผู้ใช้เสมอ
    const timer = setTimeout(() => {
      reject(new Error('การเชื่อมต่อหมดเวลา กรุณาลองใหม่อีกครั้ง'));
    }, 90000);
    google.script.run
      .withSuccessHandler((res) => { clearTimeout(timer); resolve(res); })
      .withFailureHandler((err) => { clearTimeout(timer); reject(err); })
      [funcName](...args);
  });
}

// ===== Client-side Cache (sessionStorage, TTL-based) — ลด round-trip ทำให้หน้าโหลดเร็วขึ้น =====
const GAS_CACHE_PREFIX = 'ce_cache_';
function gasCacheGet(key) {
  try {
    const raw = sessionStorage.getItem(GAS_CACHE_PREFIX + key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || Date.now() > obj.expires) { sessionStorage.removeItem(GAS_CACHE_PREFIX + key); return null; }
    return obj.data;
  } catch (e) { return null; }
}
function gasCacheSet(key, data, ttlMinutes) {
  try {
    sessionStorage.setItem(GAS_CACHE_PREFIX + key, JSON.stringify({ data, expires: Date.now() + ttlMinutes * 60000 }));
  } catch (e) { /* storage full — ข้าม cache ได้โดยไม่กระทบระบบ */ }
}
function gasCacheClear() {
  try {
    Object.keys(sessionStorage).filter(k => k.startsWith(GAS_CACHE_PREFIX)).forEach(k => sessionStorage.removeItem(k));
  } catch (e) { /* ignore */ }
}
function runGASCached(funcName, ttlMinutes, ...args) {
  const key = funcName + ':' + JSON.stringify(args);
  const hit = gasCacheGet(key);
  if (hit !== null) return Promise.resolve(hit);
  return runGAS(funcName, ...args).then(res => { gasCacheSet(key, res, ttlMinutes); return res; });
}

// Formatters
function formatStudentId(val) {
  if (!val) return '';
  const digits = String(val).replace(/\D/g, '').slice(0, 10);
  if (digits.length <= 9) return digits;
  return `${digits.slice(0, 9)}-${digits.slice(9, 10)}`;
}

function formatPhoneNumber(val) {
  if (!val) return '';
  const digits = String(val).replace(/\D/g, '').slice(0, 10);
  if (digits.length <= 3) return digits;
  if (digits.length <= 6) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
  return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6, 10)}`;
}

const StatusBadge = {
  props: {
    status: { type: [String, Number], default: '' },
    label: { type: String, default: '' }
  },
  computed: {
    normalizedStatus() { return String(this.status || '').toLowerCase(); },
    badgeClass() {
      const map = {
        approved: 'badge-approved', active: 'badge-active', available: 'badge-approved',
        pending: 'badge-pending', rejected: 'badge-rejected', skipped: 'badge-skipped',
        inactive: 'badge-rejected', expired: 'badge-rejected'
      };
      return map[this.normalizedStatus] || 'badge-pending';
    }
  },
  template: `<span :class="['ui-badge', badgeClass]">{{ label || status || '-' }}</span>`
};

// ==========================================
// 2. Request View Component (Tab 1)
// ==========================================
const RequestView = {
  props: ['lang', 't', 'userEmail'],
  emits: ['loading', 'switch-to-dashboard'],
  data() {
    return {
      currentStep: 0,
      rooms: [],
      advisors: [],
      advisorSearch: '',
      isAdvisorOpen: false,
      selectedAdvisorObj: null,
      form: {
        personType: 'Student',
        staffType: '',
        degreeLevel: '',
        division: 'แผนกวิศวกรรมโครงสร้าง',
        department: 'วิศวกรรมโยธา',
        faculty: 'วิศวกรรมศาสตร์',
        fullName: '',
        email: this.userEmail || (window.PRELOADED_USER_EMAIL || ''),
        phone: '',
        studentId: '',
        externalOrg: '',
        projectTopic: '',
        justification: '',
        roomId: '',
        purpose: '',
        startDate: new Date().toISOString().split('T')[0],
        allowedTimeStart: '00:00',
        allowedTimeEnd: '23:59',
        biometricAppointmentDate: '',
        biometricDate: '',
        biometricTime: '',
        advisorEmail: '',
        participantNames: '',
        emergencyContact: '',
        photoData: ''
      }
    };
  },
  computed: {
    isCivilStudent() {
      const isStudent = this.form.personType === 'Student';
      const isCivil = (this.form.department || '').indexOf('โยธา') !== -1 || (this.form.department || '').toLowerCase().indexOf('civil') !== -1;
      const isEng = (this.form.faculty || '').indexOf('วิศว') !== -1 || (this.form.faculty || '').toLowerCase().indexOf('eng') !== -1 || !this.form.faculty;
      return isStudent && isCivil && isEng;
    },
    filteredAdvisors() {
      if (!this.advisorSearch) return this.advisors;
      const q = this.advisorSearch.toLowerCase();
      return this.advisors.filter(a =>
        (a.fullName || '').toLowerCase().includes(q) ||
        (a.division || '').toLowerCase().includes(q) ||
        (a.email || '').toLowerCase().includes(q)
      );
    }
  },
  watch: {
    userEmail(val) {
      if (val && !this.form.email) this.form.email = val;
    },
    // เมื่อผู้ใช้พิมพ์ email เองบนมือถือ (กรณี account ไม่ตรง) → ดึงข้อมูลอัตโนมัติ
    'form.email'(val) {
      if (this._emailDebounce) clearTimeout(this._emailDebounce);
      if (val && val.includes('@') && val.includes('.')) {
        this._emailDebounce = setTimeout(() => this.fetchUserDataByEmail(val), 800);
      }
    }
  },
  async mounted() {
    this.$emit('loading', true);
    // โหลดห้อง + อาจารย์ + ข้อมูลผู้ใช้แบบขนาน (parallel) พร้อม cache ลด round-trip
    const roomPromise = runGASCached('getRoomList', 10).then(rooms => {
      this.rooms = Array.isArray(rooms) ? rooms : [];
      if (this.rooms.length > 0) this.form.roomId = this.rooms[0].roomId;
    }).catch(e => console.error('Failed to load rooms:', e));

    const advisorPromise = runGASCached('getAdvisorList', 30).then(advisors => {
      this.advisors = Array.isArray(advisors) ? advisors : [];
    }).catch(e => console.error('Failed to load advisors:', e));

    const userPromise = this.form.email
      ? this.fetchUserDataByEmail(this.form.email).catch(e => console.error('Failed to load user data:', e))
      : Promise.resolve();

    await Promise.all([roomPromise, advisorPromise, userPromise]);
    this.$emit('loading', false);
  },
  methods: {
    async fetchUserDataByEmail(email) {
      try {
        const userData = await runGAS('getUserByEmail', email);
        if (userData && userData.fullName) {
          this.form.fullName = userData.fullName || '';
          this.form.phone = formatPhoneNumber(userData.phone || '');
          this.form.studentId = formatStudentId(userData.studentId || '');
          this.form.department = userData.department || 'วิศวกรรมโยธา';
          this.form.division = userData.division || 'แผนกวิศวกรรมโครงสร้าง';
        }
      } catch (e) {
        console.warn('fetchUserDataByEmail:', e);
      }
    },
    onStudentIdInput(e) {
      this.form.studentId = formatStudentId(e.target.value);
    },
    onPhoneInput(e) {
      this.form.phone = formatPhoneNumber(e.target.value);
    },
    selectAdvisor(adv) {
      this.selectedAdvisorObj = adv;
      this.form.advisorEmail = adv.email;
      this.advisorSearch = `${adv.fullName} ${adv.division}`;
      this.isAdvisorOpen = false;
    },
    clearAdvisorSearch() {
      this.selectedAdvisorObj = null;
      this.form.advisorEmail = '';
      this.advisorSearch = '';
    },
    handlePhoto(e) {
      const file = e.target.files ? e.target.files[0] : null;
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) {
        Swal.fire(this.t.errorTitle, 'ขนาดไฟล์ภาพเกิน 2MB', 'warning');
        return;
      }
      const reader = new FileReader();
      reader.onload = (event) => { this.form.photoData = event.target.result; };
      reader.readAsDataURL(file);
    },
    nextStep() {
      const missing = [];
      const t = this.t;

      if (this.currentStep === 0) {
        if (this.form.personType === 'Staff' && !this.form.staffType) missing.push(t.staffTypeLabel);
        if (this.form.personType === 'Student' && !this.form.degreeLevel) missing.push(t.degreeLevel);
      }
      if (this.currentStep === 1) {
        if (!this.form.photoData) missing.push(t.photoUploadTitle);
        if (!this.form.email) missing.push(t.email);
        if (!this.form.fullName) missing.push(t.fullName);
        if (!this.form.phone) missing.push(t.phone);
        if (this.form.personType === 'Student' && !this.form.studentId) missing.push(t.studentId);
        if (!this.form.department) missing.push(t.department);
        if (this.form.personType === 'External' && !this.form.externalOrg) missing.push(t.externalOrg);
        if (!this.form.projectTopic) missing.push(t.projectTopic);
      }
      if (this.currentStep === 2) {
        if (!this.form.roomId) missing.push(t.selectRoom);
        if (!this.form.startDate) missing.push(t.startDate);
        if (!this.form.allowedTimeStart) missing.push(t.allowedTimeStart);
        if (!this.form.allowedTimeEnd) missing.push(t.allowedTimeEnd);
        if (!this.form.biometricDate) missing.push(t.biometricDate);
        if (!this.form.biometricTime) missing.push(t.biometricTime);
        if (!this.form.purpose) missing.push(t.purpose);

        if (this.form.startDate && this.form.biometricDate && this.form.biometricDate > this.form.startDate) {
          Swal.fire(t.errorTitle, t.biometricBeforeStartError, 'warning');
          return;
        }
      }
      if (this.currentStep === 3) {
        if (this.isCivilStudent && !this.form.advisorEmail) missing.push(t.advisorLabel);
      }
      if (this.currentStep === 4) {
        if (!this.form.emergencyContact) missing.push(t.emergencyContact);
      }

      if (missing.length > 0) {
        this.showMissingFields(missing);
        return;
      }
      this.currentStep++;
    },
    showMissingFields(fields) {
      const items = fields.map(f => '<li>' + f + '</li>').join('');
      Swal.fire({
        title: this.t.errorTitle,
        html:
          '<div style="text-align:left;font-size:14px;line-height:1.8;">' +
          '<p style="margin-bottom:6px;font-weight:700;color:#1e293b;">' + this.t.missingFieldsTitle + '</p>' +
          '<ul style="padding-left:20px;color:#b91c1c;font-weight:600;">' + items + '</ul></div>',
        icon: 'warning',
        confirmButtonText: this.t.btnClose
      });
    },
    prevStep() { this.currentStep--; },
    async submitForm() {
      if (!this.form.photoData) {
        Swal.fire(this.t.errorTitle, this.t.photoRequired, 'warning');
        return;
      }

      // รวมวันที่ + เวลา Biometric เป็น datetime string ก่อนส่ง
      if (this.form.biometricDate && this.form.biometricTime) {
        this.form.biometricAppointmentDate = this.form.biometricDate + 'T' + this.form.biometricTime + ':00';
      }

      this.$emit('loading', true);
      try {
        const res = await runGAS('submitRequest', this.form);
      gasCacheClear(); // ข้อมูลเปลี่ยนหลัง submit — ล้าง cache เพื่อให้ Dashboard สดเสมอ
        if (res.success) {
          Swal.fire({
            title: this.t.submitSuccessTitle,
            html: `
              <div style="text-align:left;font-size:14px;line-height:1.8;">
                <p><b>เลขที่คำขอ:</b> <span style="color:#661003;font-weight:bold;">${res.requestId}</span></p>
                <p><b>Access Code:</b> <span style="color:#183666;font-weight:bold;font-size:18px;">${res.accessCode || '-'}</span></p>
                <p><b>สถานะ:</b> ${this.t[res.overallStatus] || res.overallStatus}</p>
              </div>
            `,
            icon: 'success',
            confirmButtonText: this.t.btnClose
          }).then(() => {
            this.$emit('switch-to-dashboard');
          });
        }
      } catch (err) {
        Swal.fire(this.t.errorTitle, err.message, 'error');
      } finally {
        this.$emit('loading', false);
      }
    }
  },
  template: `
    <div>
      <!-- Stepper Header -->
      <div class="stepper-wrap">
        <div v-for="(name, idx) in [t.step0, t.step1, t.step2, t.step3, t.step4]" :key="idx" :class="['step-item', currentStep > idx ? 'done' : '']">
          <div :class="['step-bubble', currentStep === idx ? 'active' : (currentStep > idx ? 'done' : '')]">

                <h4 style="font-weight:700;">{{ t.staff }}</h4>
                <p style="font-size:0.75rem;color:#64748b;margin-top:4px;">{{ t.staffDesc }}</p>
              </div>

              <div :class="['type-card', form.personType === 'External' ? 'active' : '']" @click="form.personType = 'External'">
                <div class="type-icon">🌐</div>
                <h4 style="font-weight:700;">{{ t.external }}</h4>

                  <span class="sub-type-icon">🎓</span>

                <div :class="['sub-type-card', form.staffType === 'Support' ? 'active' : '']" @click="form.staffType = 'Support'">
                  <span class="sub-type-icon">🛠️</span>
                  <span class="sub-type-label">{{ t.supportStaff }}</span>

            <div v-if="form.personType === 'Student'" class="form-field" style="margin-top:1rem;">

const DashboardView = {
  props: ['lang', 't', 'userEmail', 'userRole'],
  emits: ['loading'],
  data() {
    return {
      stats: {},
      rooms: [],
      closures: [],
      chartInstances: {},
      // Review Modal (when opened from email token or clicked)
      showReviewModal: false,
      reviewData: null,
      reviewToken: '',
      reviewStage: 1,
      reviewNote: '',
      adminStartDate: '',
      adminBiometricDate: '',
      isReadOnly: false
    };
  },
  components: { ReviewModal, StatusBadge, RoomCard, ModalConfirm, TimelineStep, LoadingSpinner },
  async mounted() {
    this.$emit('loading', true);

    // [1] เปิด Review Modal จาก token ใน URL ก่อนเสมอ (ไม่ขึ้นกับข้อมูล dashboard)
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const getParam = (key) => urlParams.get(key) || (window.SERVER_PARAMS && window.SERVER_PARAMS[key]);
      const token = getParam('token');
      const stage = getParam('stage');
      const view = getParam('view');

      if (token && (stage || view === 'approver' || view === 'status')) {
        await this.openReviewModal(token, stage || 1, view === 'status');
      }
    } catch (e) {
      console.error('Open review modal failed:', e);
    }

    // [2] โหลดข้อมูล dashboard แยกอิสระ (ถ้าโหลดไม่สำเร็จก็ไม่กระทบ modal)
    try {
      const [stats, rooms, closures] = await Promise.all([
        runGASCached('getDashboardStats', 2).catch(() => ({})),
        runGASCached('getRoomList', 10).catch(() => []),
        runGASCached('getRoomClosureList', 5).catch(() => [])
      ]);
      this.stats = stats || {};
      this.rooms = rooms || [];
      this.closures = closures || [];
      this.$nextTick(() => this.renderAllCharts());
    } catch (e) {
      console.error(e);
    } finally {
      this.$emit('loading', false);
    }
  },
  methods: {
    destroyChart(id) {
      if (this.chartInstances[id]) {
        this.chartInstances[id].destroy();
        delete this.chartInstances[id];
      }
    },
    makeChart(id, type, labels, data, colors, options = {}) {
      this.destroyChart(id);
      const ctx = document.getElementById(id);
      if (!ctx) return;
      const defaultColors = ['#661003','#10B981','#3B82F6','#F59E0B','#8B5CF6','#EF4444','#06B6D4','#F97316','#84CC16','#EC4899','#6366F1','#14B8A6'];
      this.chartInstances[id] = new Chart(ctx, {
        type,
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: colors || defaultColors.slice(0, data.length),
            borderColor: type === 'line' ? (colors ? colors[0] : '#661003') : 'transparent',
            borderWidth: type === 'line' ? 2 : 0,
            fill: type === 'line',
            tension: 0.4,
            pointBackgroundColor: '#661003',
            pointRadius: 4,
            ...options.datasetOptions
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: type === 'bar' || type === 'line' ? 'top' : 'bottom', labels: { font: { family: 'Sarabun', size: 12 }, boxWidth: 14 } },
            tooltip: { callbacks: { label: ctx => ` ${ctx.label || ctx.dataset.label || ''}: ${ctx.parsed.y ?? ctx.parsed} คน/คำขอ` } }
          },
          scales: (type === 'bar' || type === 'line') ? {
            x: { ticks: { font: { family: 'Sarabun', size: 11 }, maxRotation: 30 }, grid: { display: false } },
            y: { beginAtZero: true, ticks: { font: { family: 'Sarabun', size: 11 }, stepSize: 1 }, grid: { color: '#f1f5f9' } }
          } : undefined,
          ...options.chartOptions
        }
      });
    },
    renderAllCharts() {
      const s = this.stats;

      // 1. Status Doughnut
      if (s.statusStats && Object.keys(s.statusStats).length) {
        this.makeChart('chart-status', 'doughnut',
          Object.keys(s.statusStats).map(k => this.t[k] || k),
          Object.values(s.statusStats),
          ['#10B981','#F59E0B','#3B82F6','#EF4444','#9CA3AF','#661003','#8B5CF6']
        );
      }

      // 2. Person Type Bar
      if (s.personTypeStats && Object.keys(s.personTypeStats).length) {
        const ptMap = { Student: 'นักศึกษา', Staff: 'บุคลากร', External: 'บุคคลภายนอก' };
        this.makeChart('chart-persontype', 'bar',
          Object.keys(s.personTypeStats).map(k => ptMap[k] || k),
          Object.values(s.personTypeStats),
          ['#3B82F6','#8B5CF6','#F97316']
        );
      }

      // 3. Degree Level Doughnut
      if (s.degreeLevelStats && Object.keys(s.degreeLevelStats).length) {
        const dlMap = { Bachelor: 'ปริญญาตรี', Master: 'ปริญญาโท', Doctoral: 'ปริญญาเอก' };
        this.makeChart('chart-degree', 'doughnut',
          Object.keys(s.degreeLevelStats).map(k => dlMap[k] || k),
          Object.values(s.degreeLevelStats),
          ['#661003','#F59E0B','#3B82F6']
        );
      }

      // 4. Division Bar (horizontal via bar with indexAxis)
      if (s.divisionStats && Object.keys(s.divisionStats).length) {
        const divLabels = Object.keys(s.divisionStats).map(k => k.replace('แผนกวิศวกรรม','').replace('วิศวกรรม',''));
        this.destroyChart('chart-division');
        const ctx = document.getElementById('chart-division');
        if (ctx) {
          this.chartInstances['chart-division'] = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: divLabels,
              datasets: [{ data: Object.values(s.divisionStats), backgroundColor: '#661003', borderRadius: 4 }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { beginAtZero: true, ticks: { font: { family: 'Sarabun', size: 11 }, stepSize: 1 }, grid: { color: '#f1f5f9' } },
                y: { ticks: { font: { family: 'Sarabun', size: 11 } }, grid: { display: false } }
              }
            }
          });
        }
      }

      // 5. Outside Faculty / External Pie
      if (s.outsideFacultyStats && Object.keys(s.outsideFacultyStats).length) {
        const ofMap = { civil: 'โยธา (ในสาขา)', nonCivil: 'ต่างสาขา/คณะ', external: 'บุคคลภายนอก' };
        this.makeChart('chart-outside', 'pie',
          Object.keys(s.outsideFacultyStats).map(k => ofMap[k] || k),
          Object.values(s.outsideFacultyStats),
          ['#183666','#F59E0B','#EF4444']
        );
      }

      // 6. Top Advisors Bar
      if (s.advisorStats && Object.keys(s.advisorStats).length) {
        const sorted = Object.entries(s.advisorStats).sort((a,b)=>b[1]-a[1]).slice(0,10);
        this.makeChart('chart-advisor', 'bar',
          sorted.map(([k]) => k.split(' ').slice(0,3).join(' ')),
          sorted.map(([,v]) => v),
          sorted.map((_,i) => `hsl(${210+i*15},60%,${45+i*3}%)`)
        );
      }

      // 7. Monthly Frequency Line
      if (s.monthlyStats && Object.keys(s.monthlyStats).length) {
        this.makeChart('chart-monthly', 'line',
          Object.keys(s.monthlyStats),
          Object.values(s.monthlyStats),
          ['rgba(24,54,102,0.25)'],
          { datasetOptions: { borderColor: '#183666', backgroundColor: 'rgba(24,54,102,0.1)', fill: true } }
        );
      }

      // 8. Room Usage Bar
      if (s.roomUsageStats && Object.keys(s.roomUsageStats).length) {
        this.makeChart('chart-room', 'bar',
          Object.keys(s.roomUsageStats),
          Object.values(s.roomUsageStats),
          ['#10B981','#3B82F6','#F59E0B','#8B5CF6','#EF4444','#F97316']
        );
      }
    },
    async openReviewModal(token, stage, isReadOnly = false) {
      this.$emit('loading', true);
      this.reviewToken = token;
      this.reviewStage = Number(stage || 1);
      this.isReadOnly = isReadOnly;
      try {
        const res = await runGAS('getApprovalRequestByToken', token, this.isReadOnly ? null : this.reviewStage);
        if (res.success) {
          this.isReadOnly = isReadOnly || !!res.readOnlyView;
          this.reviewData = res;
          this.adminStartDate = res.startDate || '';
          this.adminBiometricDate = res.biometricAppointmentDate || '';
          this.showReviewModal = true;
        } else {
          Swal.fire(this.t.errorTitle, res.message || 'Token ไม่ถูกต้องหรือหมดอายุแล้ว', 'error');
        }
      } catch (err) {
        Swal.fire(this.t.errorTitle, err.message, 'error');
      } finally {
        this.$emit('loading', false);
      }
    },
    async submitDecision(payload) {
      const decision = payload.decision;
      const note = payload.note || '';
      if (decision === 'Reject' && !note) {
        Swal.fire(this.t.errorTitle, 'กรุณาระบุเหตุผลในการปฏิเสธ', 'warning');
        return;
      }

      this.$emit('loading', true);
      try {
        const extra = payload.extra || {};
        const res = await runGAS('processApproval', this.reviewData.requestId, this.reviewStage, decision, note, this.reviewToken, extra);
        gasCacheClear(); // สถานะคำขอเปลี่ยน — ล้าง cache ให้ stats สดเสมอ
        if (res.success) {
          Swal.fire({
            title: decision === 'Approve' ? this.t.Approved : this.t.Rejected,
            text: `คำขอเลขที่: ${this.reviewData.requestId}`,
            icon: 'success'
          }).then(() => {
            this.showReviewModal = false;
            this.reviewData = null;
          });
        }
      } catch (err) {
        Swal.fire(this.t.errorTitle, err.message, 'error');
      } finally {
        this.$emit('loading', false);
      }
    },
    async exportCSV() {
      this.$emit('loading', true);
      try {
        const csv = await runGAS('exportRequestsToCSV', {});
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `ce_fair_requests_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
      } catch (err) {
        Swal.fire(this.t.errorTitle, 'Export failed', 'error');
      } finally {
        this.$emit('loading', false);
      }
    }
  },

              {{ t.noChartData }}
            </div>
          </div>
        </div>
      </div>

      <!-- Room List & Closures Grid -->
      <div style="display:grid;grid-template-columns:1fr;gap:1.5rem;">

        <!-- Room List -->
        <div class="box-card">
          <div class="box-header">
            <span>{{ t.roomsTitle }} ({{ rooms.length }})</span>
          </div>
          <div class="room-card-grid">
            <room-card v-for="r in rooms" :key="r.roomId" :room="r" :t="t"></room-card>
          </div>
        </div>

        <!-- Room Closures -->
        <div v-if="closures.length > 0" class="box-card">
          <div class="box-header">
            <span>{{ t.closuresTitle }}</span>
          </div>
          <div class="table-wrap">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>{{ t.colClosureTitle }}</th>
                  <th>{{ t.colClosureDates }}</th>
                  <th>{{ t.colClosureRooms }}</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="c in closures" :key="c.closureId">
                  <td style="font-weight:700;">{{ c.title }}</td>
                  <td>{{ c.startDate }} - {{ c.endDate }}</td>
                  <td>{{ c.affectedRoomIds }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

      <review-modal
        v-if="showReviewModal && reviewData"
        :t="t"
        :review-data="reviewData"
        :review-stage="reviewStage"
        :read-only="isReadOnly"
        :show="showReviewModal"
        @close="showReviewModal = false"
        @submit="submitDecision"
      ></review-modal>

    </div>
  `
};

// ==========================================
// 4. Token Detail / Tracking View
// ==========================================
const TokenView = {
  props: ['lang', 't', 'userEmail', 'userRole'],
  emits: ['loading', 'close'],
  components: { ReviewModal, StatusBadge, TimelineStep, ModalConfirm },
  data() {
    return {
      reviewData: null,
      reviewToken: '',
      reviewStage: 1,
      view: 'status',
      errorKey: '',
      errorRaw: '',
      showReviewModal: false,
      forceReadOnly: false
    };
  },
  computed: {
    displayError() {
      if (this.errorKey && this.t[this.errorKey]) return this.t[this.errorKey];
      if (this.errorRaw) return this.errorRaw;
      return this.t.errCannotOpen;
    }
  },
  methods: {
    resolveErrorKey(res, fallbackErr) {
      // Server returns { success: false, errorCode: '...', message: '...' }
      var errorCode = (res && res.errorCode) || '';
      var keyMap = {
        'TOKEN_NOT_FOUND': 'errTokenInvalid',
        'TOKEN_INVALID': 'errTokenInvalid',
        'TOKEN_EXPIRED': 'errTokenExpired',
        'TOKEN_USED': 'errTokenUsed',
        'TOKEN_SUSPENDED': 'errTokenSuspended',
        'UNAUTHENTICATED': 'errUnauthenticated',
        'UNAUTHORIZED': 'errUnauthorizedAccount',
        'UNAUTHORIZED_ACCOUNT': 'errUnauthorizedAccount',
        'APPROVER_MISMATCH': 'errApproverMismatch',
        'STAGE_MISMATCH': 'errStageMismatch',
        'WRONG_TOKEN_TYPE': 'errWrongTokenType',
        'TOKEN_ERROR': 'errGenericToken',
        'REQUESTS_SHEET_MISSING': 'errCannotOpen'
      };
      this.errorKey = keyMap[errorCode] || '';
      var raw =
        (res && res.message) ||
        (fallbackErr && fallbackErr.message) ||
        (fallbackErr && typeof fallbackErr === 'string' ? fallbackErr : '') ||
        (res && res.errorCode) ||
        '';
      // กันไม่ให้ error จริงถูกกลืนหาย: ถ้ายังว่างแต่มี fallbackErr ให้ถอดทั้งก้อนออกมาแสดง
      if (!raw && fallbackErr) {
        try { raw = JSON.stringify(fallbackErr); } catch (e) { raw = String(fallbackErr); }
      }
      this.errorRaw = raw;
      if (raw) console.error('[TokenView] errorCode=' + (errorCode || 'NO_CODE') + ' → ' + raw);
    },
    close() {
      // ล้าง token/view/stage ออกจากทั้ง URL และ SERVER_PARAMS เพื่อกันไม่ให้วนกลับมาเปิดหน้า token ซ้ำ
      try {
        const url = new URL(window.location.href);
        ['token', 'view', 'stage', 'action', 'note'].forEach(k => url.searchParams.delete(k));
        url.hash = '';
        window.history.replaceState({}, '', url.pathname + url.search);
      } catch (e) { /* ignore URL cleanup errors */ }
      try {
        if (window.SERVER_PARAMS) {
          ['token', 'view', 'stage', 'action', 'note'].forEach(k => { delete window.SERVER_PARAMS[k]; });
        }
      } catch (e) { /* ignore */ }
      // กลับไปหน้า dashboard ด้วยการคลิกครั้งเดียว (Index.html ผูก @close ไว้เป็น currentTab = 'dashboard')
      this.$emit('close');
    },
    async submitDecision(payload) {
      this.$emit('loading', true);
      try {
        const res = await runGAS('processApproval', payload.requestId, payload.stage, payload.decision,
          payload.note, this.reviewToken, payload.extra || {});
        if (!res || !res.success) throw new Error((res && res.message) || 'ไม่สามารถบันทึกผลการพิจารณาได้');
        await Swal.fire({ title: payload.decision === 'Approve' ? this.t.Approved : this.t.Rejected,
          text: 'คำขอเลขที่: ' + payload.requestId, icon: 'success' });
        this.$emit('close');
      } catch (err) {
        this.resolveErrorKey(null, err);
        Swal.fire(this.t.errorTitle, this.displayError || this.t.errCannotOpen, 'error');
      } finally {
        this.$emit('loading', false);
      }
    },
    async loadRequest() {
      this.errorKey = '';
      this.errorRaw = '';
      this.$emit('loading', true);
      try {
        // Probe: ตรวจก่อนว่า google.script.run ถึงเซิร์ฟเวอร์และ execute ได้จริงหรือไม่
        // ถ้าฟังก์ชันขั้นต่ำ (ping) ยังได้ null แสดงว่าปัญหาอยู่ที่ auth/bridge ไม่ใช่ตัวฟังก์ชัน
        let bridgeOk = false;
        try {
          const probe = await runGAS('ping');
          console.log('[TokenView] bridge probe result:', probe);
          bridgeOk = !!(probe && probe.ok);
        } catch (probeErr) {
          console.error('[TokenView] bridge probe FAILED:', probeErr);
        }
        if (!bridgeOk) {
          this.errorKey = 'errBridgeDown';
          return;
        }

        // วินิจฉัยเพิ่ม: หาว่า verifyToken / buildReviewPayload พังตรงไหน (object เล็ก ปลอดภัยต่อ serialize)
        try {
          const diag = await runGAS('debugGetToken', this.reviewToken, this.view === 'status' ? null : this.reviewStage);
          console.log('[TokenView] debugGetToken result:', diag);
        } catch (diagErr) {
          console.error('[TokenView] debugGetToken FAILED:', diagErr);
        }

        // ใช้ getApprovalRequestByToken ตัวเดียวสำหรับทั้ง status และ approver —
        // ฟังก์ชันนี้มีอยู่แล้วใน backend และรองรับ RequestToken (detectedStage === 'Request') อยู่แล้ว
        const maxAttempts = 1;
        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
          const res = await runGAS('getApprovalRequestByToken', this.reviewToken, this.view === 'status' ? null : this.reviewStage);
          console.log('[TokenView] getApprovalRequestByToken attempt ' + attempt + '/' + maxAttempts + ' result:', res);
          if (res === null || res === undefined) {
            // google.script.run คืน null เฉย ๆ (ไม่ใช่ error object) — ลองซ้ำอัตโนมัติก่อนแสดง error
            if (attempt < maxAttempts) {
              await new Promise(r => setTimeout(r, 900 * attempt));
              continue;
            }
            this.errorKey = 'errNullResponse';
            return;
          }
          if (!res.success) {
            this.resolveErrorKey(res, null);
            return;
          }
          this.reviewData = res;
          if (res.readOnlyView) this.forceReadOnly = true;
          return;
        }
      } catch (err) {
        console.error('[TokenView] runGAS rejected:', err);
        this.resolveErrorKey(null, err);
      } finally {
        this.$emit('loading', false);
      }
    }
  },
  async mounted() {
    const params = new URLSearchParams(window.location.search);
    this.reviewToken = params.get('token') || (window.SERVER_PARAMS && window.SERVER_PARAMS.token) || '';
    this.view = params.get('view') || (window.SERVER_PARAMS && window.SERVER_PARAMS.view) || 'status';
    this.reviewStage = Number(params.get('stage') || (window.SERVER_PARAMS && window.SERVER_PARAMS.stage) || 1);
    if (!this.reviewToken) {
      this.errorKey = 'errTokenNotFound';
      return;
    }
    await this.loadRequest();
  },
  template: `
    <div>
      <div v-if="errorKey || errorRaw" class="box-card" style="max-width:760px;margin:0 auto;padding:24px;color:#b91c1c;text-align:center;">
        <p style="margin:0 0 16px 0;">{{ displayError }}</p>
        <button v-if="errorKey === 'errNullResponse' || errorKey === 'errBridgeDown'" class="ui-btn ui-btn-primary" @click="loadRequest()">{{ t.btnRetry }}</button>
      </div>
      <review-modal v-else-if="reviewData"
        :t="t" :review-data="reviewData" :review-stage="reviewStage"
        :read-only="view !== 'approver' || forceReadOnly" :full-page="true"
        @close="close" @submit="submitDecision">
      </review-modal>
      <div v-else class="box-card" style="max-width:760px;margin:0 auto;padding:24px;color:#334155;text-align:center;">{{ t.errCannotOpen }}</div>
    </div>
  `
};

// ==========================================
// 5. Main Vue 3 App Initialization
// ==========================================
const { createApp } = Vue;

const app = createApp({
  data() {
    const urlParams = new URLSearchParams(window.location.search);
    const getParam = (key) => urlParams.get(key) || (window.SERVER_PARAMS && window.SERVER_PARAMS[key]);
    const view = getParam('view');
    const hasTokenView = !!getParam('token') && ['status', 'detail', 'approver'].indexOf(view) >= 0;
    const hasTokenOrReview = getParam('token') || getParam('action') || window.location.hash === '#dashboard';

    return {
      currentTab: hasTokenView ? 'token' : (hasTokenOrReview ? 'dashboard' : 'request'),
      currentLang: localStorage.getItem('app_lang') || 'th',
      userEmail: window.PRELOADED_USER_EMAIL || '',
      userRole: 'Applicant',
      loading: false,
      loadingTimer: null,
      loadingMsgIdx: 0
    };
  },
  computed: {
    t() { return i18n[this.currentLang] || i18n.th; },
    currentYear() { return new Date().getFullYear(); },
    loadingMessages() {
      return this.currentLang === 'en'
        ? [this.t.loading, this.t.loadingLong, 'Creating request...', 'Verifying data...', 'Connecting to server...']
        : [this.t.loading, this.t.loadingLong, 'กำลังสร้างคำขอ...', 'กำลังตรวจสอบข้อมูล...', 'กำลังเชื่อมต่อเซิร์ฟเวอร์...'];
    },
    loadingText() {
      const msgs = this.loadingMessages;
      return msgs[this.loadingMsgIdx % msgs.length];
    }
  },
  async mounted() {
    if (!this.userEmail) {
      try {
        const email = await runGAS('getCurrentUserEmail');
        if (email) {
          this.userEmail = email;
          try {
            const role = await runGAS('determineSubmitterRole', email);
            if (role) this.userRole = role;
          } catch (roleError) {
            console.warn('Determine role failed:', roleError);
          }
        }
      } catch (e) {
        console.warn('User fetch:', e);
      }
    }
  },
  methods: {
    switchLang(lang) {
      this.currentLang = lang;
      localStorage.setItem('app_lang', lang);
    },
    setLoading(val) {
      this.loading = !!val;
      if (this.loadingTimer) { clearInterval(this.loadingTimer); this.loadingTimer = null; }
      if (this.loading) {
        this.loadingMsgIdx = 0;
        this.loadingTimer = setInterval(() => {
          this.loadingMsgIdx = (this.loadingMsgIdx + 1) % this.loadingMessages.length;
        }, 4000);
      } else {
        this.loadingMsgIdx = 0;
      }
    }
  }
});

app.component('review-modal', ReviewModal);
app.component('status-badge', StatusBadge);
app.component('room-card', RoomCard);
app.component('modal-confirm', ModalConfirm);
app.component('timeline-step', TimelineStep);
app.component('loading-spinner', LoadingSpinner);
app.component('request-view', RequestView);
app.component('dashboard-view', DashboardView);
app.component('token-view', TokenView);

app.mount('#app');
</script>
