// GAS Promise Wrapper
function runGAS(funcName, ...args) {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.warn(`[Mock GAS] Calling ${funcName}`, args);
      setTimeout(() => resolve({ success: true }), 400);
      return;
    }
    google.script.run
      .withSuccessHandler((res) => resolve(res))
      .withFailureHandler((err) => reject(err))
      [funcName](...args);
  });
}

// ===== Client-side Cache (sessionStorage, TTL-based) — ลด round-trip ทำให้หน้าโหลดเร็วขึ้น =====
const GAS_CACHE_PREFIX = 'ce_cache_';
function gasCacheGet(key) {
  try {
    const raw = sessionStorage.getItem(GAS_CACHE_PREFIX + key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || Date.now() > obj.expires) { sessionStorage.removeItem(GAS_CACHE_PREFIX + key); return null; }
    return obj.data;
  } catch (e) { return null; }
}
function gasCacheSet(key, data, ttlMinutes) {
  try {
    sessionStorage.setItem(GAS_CACHE_PREFIX + key, JSON.stringify({ data, expires: Date.now() + ttlMinutes * 60000 }));
  } catch (e) { /* storage full — ข้าม cache ได้โดยไม่กระทบระบบ */ }
}
function gasCacheClear() {
  try {
    Object.keys(sessionStorage).filter(k => k.startsWith(GAS_CACHE_PREFIX)).forEach(k => sessionStorage.removeItem(k));
  } catch (e) { /* ignore */ }
}
function runGASCached(funcName, ttlMinutes, ...args) {
  const key = funcName + ':' + JSON.stringify(args);
  const hit = gasCacheGet(key);
  if (hit !== null) return Promise.resolve(hit);
  return runGAS(funcName, ...args).then(res => { gasCacheSet(key, res, ttlMinutes); return res; });
}

// Formatters
function formatStudentId(val) {
  if (!val) return '';
  const digits = String(val).replace(/\D/g, '').slice(0, 10);
  if (digits.length <= 9) return digits;
  return `${digits.slice(0, 9)}-${digits.slice(9, 10)}`;
}

function formatPhoneNumber(val) {
  if (!val) return '';
  const digits = String(val).replace(/\D/g, '').slice(0, 10);
  if (digits.length <= 3) return digits;
  if (digits.length <= 6) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
  return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6, 10)}`;
}

// 1. Signature Pad Component
// ==========================================
const SignaturePad = {
  props: ['t'],
  emits: ['update:signature'],
  data() {
    return { isDrawing: false, ctx: null };
  },
  mounted() {
    this.initCanvas();
    window.addEventListener('resize', this.initCanvas);
  },
  beforeUnmount() {
    window.removeEventListener('resize', this.initCanvas);
  },
  methods: {
    initCanvas() {
      const canvas = this.$refs.canvas;
      if (!canvas) return;
      this.ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth || 400;
      canvas.height = 170;
      this.ctx.lineWidth = 2.5;
      this.ctx.lineCap = 'round';
      this.ctx.strokeStyle = '#183666';
    },
    startDrawing(e) {
      this.isDrawing = true;
      const pos = this.getPos(e);
      this.ctx.beginPath();
      this.ctx.moveTo(pos.x, pos.y);
    },
    draw(e) {
      if (!this.isDrawing) return;
      e.preventDefault();
      const pos = this.getPos(e);
      this.ctx.lineTo(pos.x, pos.y);
      this.ctx.stroke();
      this.$emit('update:signature', this.$refs.canvas.toDataURL('image/png'));
    },
    stopDrawing() { this.isDrawing = false; },
    clear() {
      const canvas = this.$refs.canvas;
      this.ctx.clearRect(0, 0, canvas.width, canvas.height);
      this.$emit('update:signature', '');
    },
    getPos(e) {
      const rect = this.$refs.canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }
  },
  template: `
    <div class="sig-canvas-wrap">
      <canvas
        ref="canvas" class="sig-canvas"
        @mousedown="startDrawing" @mousemove="draw" @mouseup="stopDrawing" @mouseleave="stopDrawing"
        @touchstart.passive="startDrawing" @touchmove.prevent="draw" @touchend="stopDrawing">
      </canvas>
      <button type="button" @click="clear" class="sig-clear">{{ t.clearSignature }}</button>
    </div>
  `
};

const StatusBadge = {
  props: {
    status: { type: [String, Number], default: '' },
    label: { type: String, default: '' }
  },
  computed: {
    normalizedStatus() { return String(this.status || '').toLowerCase(); },
    badgeClass() {
      const map = {
        approved: 'badge-approved', active: 'badge-active', available: 'badge-approved',
        pending: 'badge-pending', rejected: 'badge-rejected', skipped: 'badge-skipped',
        inactive: 'badge-rejected', expired: 'badge-rejected'
      };
      return map[this.normalizedStatus] || 'badge-pending';
    }
  },
  template: `<span :class="['ui-badge', badgeClass]">{{ label || status || '-' }}</span>`
};

// ==========================================
// 2. Request View Component (Tab 1)
// ==========================================
const RequestView = {
  props: ['lang', 't', 'userEmail'],
  emits: ['loading', 'switch-to-dashboard'],
  components: { SignaturePad },
  data() {
    return {
      currentStep: 0,
      rooms: [],
      advisors: [],
      advisorSearch: '',
      isAdvisorOpen: false,
      selectedAdvisorObj: null,
      form: {
        personType: 'Student',
        staffType: '',
        degreeLevel: 'Bachelor',
        division: 'แผนกวิศวกรรมโครงสร้าง',
        department: 'วิศวกรรมโยธา',
        faculty: 'วิศวกรรมศาสตร์',
        fullName: '',
        email: this.userEmail || (window.PRELOADED_USER_EMAIL || ''),
        phone: '',
        studentId: '',
        externalOrg: '',
        projectTopic: '',
        justification: '',
        roomId: '',
        purpose: '',
        startDate: new Date().toISOString().split('T')[0],
        allowedTimeStart: '00:00',
        allowedTimeEnd: '23:59',
        biometricAppointmentDate: '',
        biometricDate: '',
        biometricTime: '',
        advisorEmail: '',
        participantNames: '',
        emergencyContact: '',
        signatureData: '',
        photoData: '',
        consent: false
      }
    };
  },
  computed: {
    isCivilStudent() {
      const isStudent = this.form.personType === 'Student';
      const isCivil = (this.form.department || '').indexOf('โยธา') !== -1 || (this.form.department || '').toLowerCase().indexOf('civil') !== -1;
      const isEng = (this.form.faculty || '').indexOf('วิศว') !== -1 || (this.form.faculty || '').toLowerCase().indexOf('eng') !== -1 || !this.form.faculty;
      return isStudent && isCivil && isEng;
    },
    filteredAdvisors() {
      if (!this.advisorSearch) return this.advisors;
      const q = this.advisorSearch.toLowerCase();
      return this.advisors.filter(a =>
        (a.fullName || '').toLowerCase().includes(q) ||
        (a.division || '').toLowerCase().includes(q) ||
        (a.email || '').toLowerCase().includes(q)
      );
    }
  },
  watch: {
    userEmail(val) {
      if (val && !this.form.email) this.form.email = val;
    },
    // เมื่อผู้ใช้พิมพ์ email เองบนมือถือ (กรณี account ไม่ตรง) → ดึงข้อมูลอัตโนมัติ
    'form.email'(val) {
      if (this._emailDebounce) clearTimeout(this._emailDebounce);
      if (val && val.includes('@') && val.includes('.')) {
        this._emailDebounce = setTimeout(() => this.fetchUserDataByEmail(val), 800);
      }
    }
  },
  async mounted() {
    this.$emit('loading', true);
    // โหลดห้อง + อาจารย์ + ข้อมูลผู้ใช้แบบขนาน (parallel) พร้อม cache ลด round-trip
    const roomPromise = runGASCached('getRoomList', 10).then(rooms => {
      this.rooms = Array.isArray(rooms) ? rooms : [];
      if (this.rooms.length > 0) this.form.roomId = this.rooms[0].roomId;
    }).catch(e => console.error('Failed to load rooms:', e));

    const advisorPromise = runGASCached('getAdvisorList', 30).then(advisors => {
      this.advisors = Array.isArray(advisors) ? advisors : [];
    }).catch(e => console.error('Failed to load advisors:', e));

    const userPromise = this.form.email
      ? this.fetchUserDataByEmail(this.form.email).catch(e => console.error('Failed to load user data:', e))
      : Promise.resolve();

    await Promise.all([roomPromise, advisorPromise, userPromise]);
    this.$emit('loading', false);
  },
  methods: {
    async fetchUserDataByEmail(email) {
      try {
        const userData = await runGAS('getUserByEmail', email);
        if (userData && userData.fullName) {
          this.form.fullName = userData.fullName || '';
          this.form.phone = formatPhoneNumber(userData.phone || '');
          this.form.studentId = formatStudentId(userData.studentId || '');
          this.form.department = userData.department || 'วิศวกรรมโยธา';
          this.form.division = userData.division || 'แผนกวิศวกรรมโครงสร้าง';
        }
      } catch (e) {
        console.warn('fetchUserDataByEmail:', e);
      }
    },
    onStudentIdInput(e) {
      this.form.studentId = formatStudentId(e.target.value);
    },
    onPhoneInput(e) {
      this.form.phone = formatPhoneNumber(e.target.value);
    },
    selectAdvisor(adv) {
      this.selectedAdvisorObj = adv;
      this.form.advisorEmail = adv.email;
      this.advisorSearch = `${adv.fullName} (${adv.division})`;
      this.isAdvisorOpen = false;
    },
    clearAdvisorSearch() {
      this.selectedAdvisorObj = null;
      this.form.advisorEmail = '';
      this.advisorSearch = '';
    },
    handlePhoto(e) {
      const file = e.target.files ? e.target.files[0] : null;
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) {
        Swal.fire(this.t.errorTitle, 'ขนาดไฟล์ภาพเกิน 2MB', 'warning');
        return;
      }
      const reader = new FileReader();
      reader.onload = (event) => { this.form.photoData = event.target.result; };
      reader.readAsDataURL(file);
    },
    nextStep() {
      if (this.currentStep === 1) {
        if (!this.form.fullName || !this.form.email || !this.form.phone || !this.form.department) {
          Swal.fire(this.t.errorTitle, 'กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบถ้วน', 'warning');
          return;
        }
        if (this.form.personType === 'Student' && !this.form.studentId) {
          Swal.fire(this.t.errorTitle, 'กรุณากรอกรหัสนักศึกษา', 'warning');
          return;
        }
        if (!this.form.photoData) {
          Swal.fire(this.t.errorTitle, this.t.photoRequired, 'warning');
          return;
        }
      }
      if (this.currentStep === 2) {
        if (!this.form.roomId || !this.form.startDate || !this.form.biometricDate || !this.form.biometricTime || !this.form.purpose) {
          Swal.fire(this.t.errorTitle, 'กรุณากรอกข้อมูลห้อง, วันเวลา และนัดหมาย Biometric ให้ครบถ้วน', 'warning');
          return;
        }
      }
      if (this.currentStep === 3) {
        if (this.isCivilStudent && !this.form.advisorEmail) {
          Swal.fire(this.t.errorTitle, 'กรุณาค้นหาและเลือกอาจารย์ที่ปรึกษา', 'warning');
          return;
        }
      }
      if (this.currentStep === 4) {
        if (!this.form.emergencyContact) {
          Swal.fire(this.t.errorTitle, 'กรุณาระบุชื่อ และเบอร์โทร. ผู้ติดต่อ กรณีฉุกเฉิน', 'warning');
          return;
        }
      }
      this.currentStep++;
    },
    prevStep() { this.currentStep--; },
    async submitForm() {
      if (!this.form.consent) {
        Swal.fire(this.t.errorTitle, 'กรุณายินยอมเงื่อนไขก่อนส่งคำขอ', 'warning');
        return;
      }
      if (!this.form.signatureData) {
        Swal.fire(this.t.errorTitle, 'กรุณาลงลายมือชื่อดิจิทัล', 'warning');
        return;
      }
      if (!this.form.photoData) {
        Swal.fire(this.t.errorTitle, this.t.photoRequired, 'warning');
        return;
      }

      // รวมวันที่ + เวลา Biometric เป็น datetime string ก่อนส่ง
      if (this.form.biometricDate && this.form.biometricTime) {
        this.form.biometricAppointmentDate = this.form.biometricDate + 'T' + this.form.biometricTime + ':00';
      }

      this.$emit('loading', true);
      try {
        const res = await runGAS('submitRequest', this.form);
      gasCacheClear(); // ข้อมูลเปลี่ยนหลัง submit — ล้าง cache เพื่อให้ Dashboard สดเสมอ
        if (res.success) {
          Swal.fire({
            title: this.t.submitSuccessTitle,
            html: `
              <div style="text-align:left;font-size:14px;line-height:1.8;">
                <p><b>เลขที่คำขอ:</b> <span style="color:#661003;font-weight:bold;">${res.requestId}</span></p>
                <p><b>Access Code:</b> <span style="color:#183666;font-weight:bold;font-size:18px;">${res.accessCode || '-'}</span></p>
                <p><b>สถานะ:</b> ${this.t[res.overallStatus] || res.overallStatus}</p>
              </div>
            `,
            icon: 'success',
            confirmButtonText: this.t.btnClose
          }).then(() => {
            this.$emit('switch-to-dashboard');
          });
        }
      } catch (err) {
        Swal.fire(this.t.errorTitle, err.message, 'error');
      } finally {
        this.$emit('loading', false);
      }
    }
  },
  template: `
    <div>
      <!-- Stepper Header -->
      <div class="stepper-wrap">
        <div v-for="(name, idx) in [t.step0, t.step1, t.step2, t.step3, t.step4, t.step5]" :key="idx" class="step-item">
          <div :class="['step-bubble', currentStep === idx ? 'active' : (currentStep > idx ? 'done' : '')]">

                <h4 style="font-weight:700;">{{ t.staff }}</h4>
                <p style="font-size:0.75rem;color:#64748b;margin-top:4px;">{{ t.staffDesc }}</p>
              </div>

              <div :class="['type-card', form.personType === 'External' ? 'active' : '']" @click="form.personType = 'External'">
                <div class="type-icon">🌐</div>
                <h4 style="font-weight:700;">{{ t.external }}</h4>
                <p style="font-size:0.75rem;color:#64748b;margin-top:4px;">{{ t.externalDesc }}</p>

              </select>

          </div>

          <!-- Step 1: Info & Photo -->
          <div v-if="currentStep === 1" class="form-grid">
            <div class="photo-box" @click="$refs.photoInput.click()">
              <label class="field-label" style="margin-bottom:6px;">{{ t.photoUploadTitle }} <span class="req">*</span></label>
              <div v-if="form.photoData">
                <img :src="form.photoData" alt="Preview" class="photo-preview">
                <p style="font-size:0.75rem;color:#661003;font-weight:700;">{{ t.photoChange }}</p>
              </div>
              <div v-else style="padding:10px 0;">
                <div style="font-size:2rem;">📷</div>
                <p style="font-size:0.8rem;color:#475569;font-weight:600;">{{ t.photoUploadHint }}</p>
              </div>

            </div>

            <div class="form-grid form-grid-2">
              <div class="form-field">
                <label class="field-label">{{ t.email }} <span class="req">*</span></label>
                <input type="email" v-model="form.email" class="field-input" required>
              </div>
              <div class="form-field">
                <label class="field-label">{{ t.fullName }} <span class="req">*</span></label>
                <input type="text" v-model="form.fullName" class="field-input" required>
              </div>
              <div class="form-field">

                <input type="tel" :value="form.phone" @input="onPhoneInput" placeholder="081-234-5678" maxlength="12" class="field-input" required>

              <div v-if="form.personType === 'Student'" class="form-field">

              <div class="form-field">

                  <option value="แผนกวิศวกรรมโครงสร้าง">{{ t.div1 }}</option>
                  <option value="แผนกวิศวกรรมขนส่ง">{{ t.div2 }}</option>
                  <option value="แผนกวิศวกรรมการบริหารงานก่อสร้าง">{{ t.div3 }}</option>
                  <option value="แผนกวิศวกรรมวัสดุ">{{ t.div4 }}</option>
                  <option value="แผนกวิศวกรรมทรัพยากรน้ำ">{{ t.div5 }}</option>

                  <option value="แผนกวิศวกรรมสำรวจ">{{ t.div7 }}</option>
                  <option value="ต่างสาขา / ต่างคณะ / ไม่มีแผนก">{{ t.divOther }}</option>
                </select>
              </div>
              <div class="form-field">
                <label class="field-label">{{ t.faculty }}</label>
                <input type="text" v-model="form.faculty" class="field-input">
              </div>
              <div v-if="form.personType === 'External'" class="form-field">
                <label class="field-label">{{ t.externalOrg }} <span class="req">*</span></label>
                <input type="text" v-model="form.externalOrg" class="field-input" required>
              </div>
              <div class="form-field md:col-span-2">
                <label class="field-label">{{ t.projectTopic }}</label>
                <input type="text" v-model="form.projectTopic" class="field-input">
              </div>
            </div>

          <div v-if="currentStep === 4" class="form-grid">
            <div class="form-field">
              <label class="field-label">{{ t.participantNames }}</label>
              <textarea v-model="form.participantNames" class="field-input" rows="2" placeholder="ระบุชื่อผู้ร่วมใช้งาน..."></textarea>
            </div>
            <div class="form-field">
              <label class="field-label">{{ t.emergencyContact }} <span class="req">*</span></label>
              <input type="text" v-model="form.emergencyContact" class="field-input" :placeholder="t.emergencyPlaceholder" required>
            </div>
          </div>

          <!-- Step 5: Digital Signature & Submit -->
          <div v-if="currentStep === 5" class="form-grid">
            <div class="form-field">
              <label class="field-label">{{ t.signaturePadTitle }} <span class="req">*</span></label>
              <signature-pad :t="t" @update:signature="form.signatureData = $event"></signature-pad>
            </div>
            <div style="margin-top:10px;">
              <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#475569;cursor:pointer;">
                <input type="checkbox" v-model="form.consent" style="margin-top:3px;">
                <span>{{ t.consentText }}</span>
              </label>
            </div>
          </div>

        </div>

        <div class="box-footer">
          <button v-if="currentStep > 0" @click="prevStep" class="ui-btn ui-btn-outline">
            &larr; {{ t.btnPrev }}
          </button>
          <div v-else></div>

          <button v-if="currentStep < 5" @click="nextStep" class="ui-btn ui-btn-primary">
            {{ t.btnNext }} &rarr;
          </button>
          <button v-else @click="submitForm" class="ui-btn ui-btn-primary" :disabled="!form.consent || !form.signatureData || !form.photoData">
            {{ t.btnSubmit }}
          </button>
        </div>
      </div>
    </div>
  `
};

// ==========================================

const DashboardView = {
  props: ['lang', 't', 'userEmail', 'userRole'],
  emits: ['loading'],
  data() {
    return {
      stats: {},
      rooms: [],
      closures: [],
      chartInstances: {},
      // Review Modal (when opened from email token or clicked)
      showReviewModal: false,
      reviewData: null,
      reviewToken: '',
      reviewStage: 1,
      reviewNote: '',
      adminStartDate: '',
      adminBiometricDate: '',
      isReadOnly: false
    };
  },
  components: { ReviewModal, StatusBadge, RoomCard, ModalConfirm, TimelineStep, LoadingSpinner },
  async mounted() {
    this.$emit('loading', true);
    try {
      const [stats, rooms, closures] = await Promise.all([
        runGASCached('getDashboardStats', 2),
        runGASCached('getRoomList', 10),
        runGASCached('getRoomClosureList', 5)
      ]);
      this.stats = stats || {};
      this.rooms = rooms || [];
      this.closures = closures || [];

      // Check URL parameters for direct Token Review
      const urlParams = new URLSearchParams(window.location.search);
      const getParam = (key) => urlParams.get(key) || (window.SERVER_PARAMS && window.SERVER_PARAMS[key]);
      const token = getParam('token');
      const stage = getParam('stage');
      const view = getParam('view');

      if (token && (stage || view === 'approver' || view === 'status')) {
        await this.openReviewModal(token, stage || 1, view === 'status');
      }

      this.$nextTick(() => this.renderAllCharts());
    } catch (e) {
      console.error(e);
    } finally {
      this.$emit('loading', false);
    }
  },
  methods: {
    destroyChart(id) {
      if (this.chartInstances[id]) {
        this.chartInstances[id].destroy();
        delete this.chartInstances[id];
      }
    },
    makeChart(id, type, labels, data, colors, options = {}) {
      this.destroyChart(id);
      const ctx = document.getElementById(id);
      if (!ctx) return;
      const defaultColors = ['#661003','#10B981','#3B82F6','#F59E0B','#8B5CF6','#EF4444','#06B6D4','#F97316','#84CC16','#EC4899','#6366F1','#14B8A6'];
      this.chartInstances[id] = new Chart(ctx, {
        type,
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: colors || defaultColors.slice(0, data.length),
            borderColor: type === 'line' ? (colors ? colors[0] : '#661003') : 'transparent',
            borderWidth: type === 'line' ? 2 : 0,
            fill: type === 'line',
            tension: 0.4,
            pointBackgroundColor: '#661003',
            pointRadius: 4,
            ...options.datasetOptions
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: type === 'bar' || type === 'line' ? 'top' : 'bottom', labels: { font: { family: 'Sarabun', size: 12 }, boxWidth: 14 } },
            tooltip: { callbacks: { label: ctx => ` ${ctx.label || ctx.dataset.label || ''}: ${ctx.parsed.y ?? ctx.parsed} คน/คำขอ` } }
          },
          scales: (type === 'bar' || type === 'line') ? {
            x: { ticks: { font: { family: 'Sarabun', size: 11 }, maxRotation: 30 }, grid: { display: false } },
            y: { beginAtZero: true, ticks: { font: { family: 'Sarabun', size: 11 }, stepSize: 1 }, grid: { color: '#f1f5f9' } }
          } : undefined,
          ...options.chartOptions
        }
      });
    },
    renderAllCharts() {
      const s = this.stats;

      // 1. Status Doughnut
      if (s.statusStats && Object.keys(s.statusStats).length) {
        this.makeChart('chart-status', 'doughnut',
          Object.keys(s.statusStats).map(k => this.t[k] || k),
          Object.values(s.statusStats),
          ['#10B981','#F59E0B','#3B82F6','#EF4444','#9CA3AF','#661003','#8B5CF6']
        );
      }

      // 2. Person Type Bar
      if (s.personTypeStats && Object.keys(s.personTypeStats).length) {
        const ptMap = { Student: 'นักศึกษา', Staff: 'บุคลากร', External: 'บุคคลภายนอก' };
        this.makeChart('chart-persontype', 'bar',
          Object.keys(s.personTypeStats).map(k => ptMap[k] || k),
          Object.values(s.personTypeStats),
          ['#3B82F6','#8B5CF6','#F97316']
        );
      }

      // 3. Degree Level Doughnut
      if (s.degreeLevelStats && Object.keys(s.degreeLevelStats).length) {
        const dlMap = { Bachelor: 'ปริญญาตรี', Master: 'ปริญญาโท', Doctoral: 'ปริญญาเอก' };
        this.makeChart('chart-degree', 'doughnut',
          Object.keys(s.degreeLevelStats).map(k => dlMap[k] || k),
          Object.values(s.degreeLevelStats),
          ['#661003','#F59E0B','#3B82F6']
        );
      }

      // 4. Division Bar (horizontal via bar with indexAxis)
      if (s.divisionStats && Object.keys(s.divisionStats).length) {
        const divLabels = Object.keys(s.divisionStats).map(k => k.replace('แผนกวิศวกรรม','').replace('วิศวกรรม',''));
        this.destroyChart('chart-division');
        const ctx = document.getElementById('chart-division');
        if (ctx) {
          this.chartInstances['chart-division'] = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: divLabels,
              datasets: [{ data: Object.values(s.divisionStats), backgroundColor: '#661003', borderRadius: 4 }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { beginAtZero: true, ticks: { font: { family: 'Sarabun', size: 11 }, stepSize: 1 }, grid: { color: '#f1f5f9' } },
                y: { ticks: { font: { family: 'Sarabun', size: 11 } }, grid: { display: false } }
              }
            }
          });
        }
      }

      // 5. Outside Faculty / External Pie
      if (s.outsideFacultyStats && Object.keys(s.outsideFacultyStats).length) {
        const ofMap = { civil: 'โยธา (ในสาขา)', nonCivil: 'ต่างสาขา/คณะ', external: 'บุคคลภายนอก' };
        this.makeChart('chart-outside', 'pie',
          Object.keys(s.outsideFacultyStats).map(k => ofMap[k] || k),
          Object.values(s.outsideFacultyStats),
          ['#183666','#F59E0B','#EF4444']
        );
      }

      // 6. Top Advisors Bar
      if (s.advisorStats && Object.keys(s.advisorStats).length) {
        const sorted = Object.entries(s.advisorStats).sort((a,b)=>b[1]-a[1]).slice(0,10);
        this.makeChart('chart-advisor', 'bar',
          sorted.map(([k]) => k.split(' ').slice(0,3).join(' ')),
          sorted.map(([,v]) => v),
          sorted.map((_,i) => `hsl(${210+i*15},60%,${45+i*3}%)`)
        );
      }

      // 7. Monthly Frequency Line
      if (s.monthlyStats && Object.keys(s.monthlyStats).length) {
        this.makeChart('chart-monthly', 'line',
          Object.keys(s.monthlyStats),
          Object.values(s.monthlyStats),
          ['rgba(24,54,102,0.25)'],
          { datasetOptions: { borderColor: '#183666', backgroundColor: 'rgba(24,54,102,0.1)', fill: true } }
        );
      }

      // 8. Room Usage Bar
      if (s.roomUsageStats && Object.keys(s.roomUsageStats).length) {
        this.makeChart('chart-room', 'bar',
          Object.keys(s.roomUsageStats),
          Object.values(s.roomUsageStats),
          ['#10B981','#3B82F6','#F59E0B','#8B5CF6','#EF4444','#F97316']
        );
      }
    },
    async openReviewModal(token, stage, isReadOnly = false) {
      this.$emit('loading', true);
      this.reviewToken = token;
      this.reviewStage = Number(stage || 1);
      this.isReadOnly = isReadOnly;
      try {
        const res = await runGAS('getApprovalRequestByToken', token, this.isReadOnly ? null : this.reviewStage);
        if (res.success) {
          this.reviewData = res;
          this.adminStartDate = res.startDate || '';
          this.adminBiometricDate = res.biometricAppointmentDate || '';
          this.showReviewModal = true;
        } else {
          Swal.fire(this.t.errorTitle, res.message || 'Token ไม่ถูกต้องหรือหมดอายุแล้ว', 'error');
        }
      } catch (err) {
        Swal.fire(this.t.errorTitle, err.message, 'error');
      } finally {
        this.$emit('loading', false);
      }
    },
    async submitDecision(decision) {
      if (decision === 'Reject' && !this.reviewNote) {
        Swal.fire(this.t.errorTitle, 'กรุณาระบุเหตุผลในการปฏิเสธ', 'warning');
        return;
      }

      this.$emit('loading', true);
      try {
        const extra = {};
        if (this.reviewStage === 4 && decision === 'Approve') {
          if (this.adminStartDate) extra.startDate = this.adminStartDate;
          if (this.adminBiometricDate) extra.biometricAppointmentDate = this.adminBiometricDate;
        }

        const res = await runGAS('processApproval', this.reviewData.requestId, this.reviewStage, decision, this.reviewNote, this.reviewToken, extra);
        gasCacheClear(); // สถานะคำขอเปลี่ยน — ล้าง cache ให้ stats สดเสมอ
        if (res.success) {
          Swal.fire({
            title: decision === 'Approve' ? this.t.Approved : this.t.Rejected,
            text: `คำขอเลขที่: ${this.reviewData.requestId}`,
            icon: 'success'
          }).then(() => {
            this.showReviewModal = false;
            this.reviewData = null;
          });
        }
      } catch (err) {
        Swal.fire(this.t.errorTitle, err.message, 'error');
      } finally {
        this.$emit('loading', false);
      }
    },
    async exportCSV() {
      this.$emit('loading', true);
      try {
        const csv = await runGAS('exportRequestsToCSV', {});
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `ce_fair_requests_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
      } catch (err) {
        Swal.fire(this.t.errorTitle, 'Export failed', 'error');
      } finally {
        this.$emit('loading', false);
      }
    }
  },

const { createApp } = Vue;

const app = createApp({
  data() {
    const urlParams = new URLSearchParams(window.location.search);
    const getParam = (key) => urlParams.get(key) || (window.SERVER_PARAMS && window.SERVER_PARAMS[key]);
    const hasTokenOrReview = getParam('token') || getParam('action') || window.location.hash === '#dashboard';

    return {
      currentTab: hasTokenOrReview ? 'dashboard' : 'request',
      currentLang: localStorage.getItem('app_lang') || 'th',
      userEmail: window.PRELOADED_USER_EMAIL || '',
      userRole: 'Applicant',
      loading: false,
      loadingTimer: null,
      isLongLoading: false
    };
  },
  computed: {
    t() { return i18n[this.currentLang] || i18n.th; },
    currentYear() { return new Date().getFullYear(); }
  },
  async mounted() {
    if (!this.userEmail) {
      try {
        const email = await runGAS('getCurrentUserEmail');
        if (email) {
          this.userEmail = email;
          try {
            const role = await runGAS('determineSubmitterRole', email);
            if (role) this.userRole = role;
          } catch (roleError) {
            console.warn('Determine role failed:', roleError);
          }
        }
      } catch (e) {
        console.warn('User fetch:', e);
      }
    }
  },
  methods: {
    switchLang(lang) {
      this.currentLang = lang;
      localStorage.setItem('app_lang', lang);
    },
    setLoading(val) {
      this.loading = !!val;
      if (this.loading) {
        this.isLongLoading = false;
        if (this.loadingTimer) clearTimeout(this.loadingTimer);
        this.loadingTimer = setTimeout(() => {
          if (this.loading) this.isLongLoading = true;
        }, 4000);
      } else {
        if (this.loadingTimer) clearTimeout(this.loadingTimer);
        this.isLongLoading = false;
      }
    }
  }
});

app.component('review-modal', ReviewModal);
app.component('status-badge', StatusBadge);
app.component('room-card', RoomCard);
app.component('modal-confirm', ModalConfirm);
app.component('timeline-step', TimelineStep);
app.component('loading-spinner', LoadingSpinner);
app.component('signature-pad', SignaturePad);
app.component('request-view', RequestView);
app.component('dashboard-view', DashboardView);

app.mount('#app');
</script>
